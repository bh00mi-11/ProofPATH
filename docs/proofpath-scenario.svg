<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 310" role="img" aria-labelledby="title desc">
<title id="title">ProofPATH fictional incident journey</title><desc id="desc">Five steps from synthetic evidence to an accountable privacy-reviewed PDF</desc>
<rect width="1100" height="310" rx="20" fill="#f8f7ff"/>
<text x="36" y="50" font-family="Arial,sans-serif" font-size="30" font-weight="700" fill="#292061">A fictional case, made traceable</text>
<text x="36" y="78" font-family="Arial,sans-serif" font-size="16" fill="#51497e">Aanya documents unwanted contact after a stop request. Every conclusion points back to reviewed evidence.</text>
<g font-family="Arial,sans-serif" text-anchor="middle">
<rect x="32" y="113" width="190" height="144" rx="14" fill="#e9e6ff" stroke="#c7bfff"/>
<text x="127" y="149" font-size="22" fill="#4338ca" font-weight="700">01 · Capture</text><text x="127" y="183" font-size="15" fill="#292061">Synthetic messages</text><text x="127" y="207" font-size="15" fill="#292061">SHA-256 digest</text>
<rect x="244" y="113" width="190" height="144" rx="14" fill="#e9e6ff" stroke="#c7bfff"/>
<text x="339" y="149" font-size="22" fill="#4338ca" font-weight="700">02 · Review</text><text x="339" y="183" font-size="15" fill="#292061">Dates + observations</text><text x="339" y="207" font-size="15" fill="#292061">User checks facts</text>
<rect x="456" y="113" width="190" height="144" rx="14" fill="#e9e6ff" stroke="#c7bfff"/>
<text x="551" y="149" font-size="22" fill="#4338ca" font-weight="700">03 · Trace</text><text x="551" y="183" font-size="15" fill="#292061">Claims + links</text><text x="551" y="207" font-size="15" fill="#292061">Conflicts explained</text>
<rect x="668" y="113" width="190" height="144" rx="14" fill="#e9e6ff" stroke="#c7bfff"/>
<text x="763" y="149" font-size="22" fill="#4338ca" font-weight="700">04 · Act</text><text x="763" y="183" font-size="15" fill="#292061">User-reported action</text><text x="763" y="207" font-size="15" fill="#292061">Follow-up date</text>
<rect x="880" y="113" width="190" height="144" rx="14" fill="#ddd7ff" stroke="#9d8ef0"/>
<text x="975" y="149" font-size="22" fill="#4338ca" font-weight="700">05 · Share</text><text x="975" y="183" font-size="15" fill="#292061">Privacy Lens</text><text x="975" y="207" font-size="15" fill="#292061">Confirmed PDF</text>
</g>

# Free, ephemeral backend for synthetic demo data only.
services:
  - type: web
    name: proofpath-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PROOFPATH_ENV
        value: production
      - key: PROOFPATH_CORS_ORIGINS
        sync: false

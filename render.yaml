services:
  - type: web
    name: proofpath-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PROOFPATH_ENV
        value: production
      - key: PROOFPATH_CORS_ORIGINS
        sync: false
      - key: PROOFPATH_DB_PATH
        value: /var/data/proofpath.db
      - key: PROOFPATH_VAULT_DIR
        value: /var/data/vault
    disk:
      name: proofpath-data
      mountPath: /var/data
      sizeGB: 1
